name: teraprox-core-deploy-gcp-prod
on:
  push:
    branches: ["master", "gcp-migration"]
  workflow_dispatch:

env:
  SERVICE_NAME: teraprox-core
  REGION: southamerica-east1
  AR_REPO: southamerica-east1-docker.pkg.dev/teraprox/teraprox-docker

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -f Dockerfile.prod \
            -t ${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            -t ${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:latest .
          docker push ${{ env.AR_REPO }}/${{ env.SERVICE_NAME }} --all-tags

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.AR_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: >-
            --port=3001
            --allow-unauthenticated
