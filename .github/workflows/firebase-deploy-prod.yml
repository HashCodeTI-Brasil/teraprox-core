name: Deploy Core to Firebase Hosting
on:
  push:
    branches: ["master", "gcp-migration"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build local packages
        run: |
          npm run build --prefix packages/core-sdk
          npm run build --prefix packages/ui-kit

      - name: Build
        env:
          REMOTE_SGP_URL: https://teraprox-sgp.web.app
          REMOTE_SGM_URL: https://teraprox-sgm.web.app
          REACT_APP_FIREBASE_CONFIG: ${{ secrets.REACT_APP_FIREBASE_CONFIG }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: teraprox
          channelId: live
          target: teraprox-core
